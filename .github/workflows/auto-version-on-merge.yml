name: Auto Version On Merge

on:
  push:
    branches:
      - main

concurrency:
  group: auto-version-on-merge-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    if: ${{ github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and push atomically
        id: bump
        run: |
          npm version patch -m "chore(release): %s [skip ci]"
          tag="v$(node -p "require('./package.json').version")"
          tag_body="chore(release): ${tag#v} [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main --tags
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi

            git tag -d "$tag"
            git tag -a "$tag" -m "$tag_body"

            if git push --atomic origin HEAD:main "$tag"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "Failed to push release commit and tag after 3 attempts" >&2
          exit 1

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
